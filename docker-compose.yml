services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: mytautulli-swarm
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Chicago
    volumes:
    - mytautulli-swarm_mytautulli-swarm_config:/config
    ports:
    - target: 8181
      published: 83
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.mytautulli == true
      restart_policy:
        condition: any
volumes:
  mytautulli-swarm_mytautulli-swarm_config:
    name: mytautulli-swarm_mytautulli-swarm_config
